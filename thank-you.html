<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enquiry Received — COAST WATER</title>
    <meta
        name="description"
        content="Your COAST WATER enquiry has been received."
    >
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#49231f">

    <link rel="icon" type="image/png" href="assets/images/Coast Logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --brown: #49231f;
            --cream: #e5ded9;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background: var(--brown);
            color: var(--cream);
            font-family: "Manrope", sans-serif;
            display: grid;
            place-items: center;
            padding: 32px;
        }

        .page {
            width: min(900px, 100%);
            text-align: center;
        }

        .logo {
            width: min(180px, 45vw);
            height: auto;
            margin-bottom: 80px;
            filter: brightness(0) invert(1);
            opacity: .95;
        }

        .eyebrow {
            font-family: "DM Mono", monospace;
            font-size: 11px;
            letter-spacing: .18em;
            text-transform: uppercase;
            opacity: .65;
            margin-bottom: 28px;
        }

        h1 {
            margin: 0;
            font-size: clamp(48px, 8vw, 112px);
            line-height: .9;
            letter-spacing: -.06em;
            font-weight: 700;
        }

        p {
            max-width: 560px;
            margin: 34px auto 44px;
            font-size: 17px;
            line-height: 1.7;
            opacity: .78;
        }

        a {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            color: var(--brown);
            background: var(--cream);
            text-decoration: none;
            padding: 17px 24px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            transition:
                transform .25s ease,
                background .25s ease;
        }

        a:hover {
            transform: translateY(-3px);
            background: #fff;
        }

        @media (max-width: 600px) {
            body {
                padding: 24px;
            }

            .logo {
                margin-bottom: 55px;
            }

            p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <img
            class="logo"
            src="assets/images/Coast Logo.png"
            alt="COAST WATER"
        >

        <div class="eyebrow">ENQUIRY RECEIVED</div>

        <h1>We'll take it from here.</h1>

        <p>
            Your enquiry has been received. We'll review the details
            and get back to you.
        </p>

        <a href="index.html">
            BACK TO COAST
            <span>↗</span>
        </a>

    </main>

</body>
</html>
